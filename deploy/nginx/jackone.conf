# Pubblicazione di JackOne sotto https://<host>/jackone/.
#
# Questo file non e' un `server` a se': viene incluso dentro il server 443 condiviso del
# server di sviluppo (`include /etc/nginx/apps-enabled/*.conf;`), che ospita piu'
# applicazioni sullo stesso IP distinguendole per prefisso. Quel blocco sta nel repo
# local-proxy-dev, non qui: TLS, redirect da http e pagina vuota sulla root non sono affari del
# gioco.
#
# Installazione: /etc/nginx/apps-enabled/jackone.conf  (deploy/setup-nginx.sh)
# Dipende da:    il blocco condiviso, per la variabile $connection_upgrade

# Senza barra finale i percorsi relativi della pagina si risolverebbero sulla root del
# server: `/css/main.css` invece di `/jackone/css/main.css`.
location = /jackone {
  return 301 /jackone/;
}

location /jackone/ {
  # La barra finale toglie il prefisso: il container continua a vedere richieste sulla
  # root e non sa di stare dietro a nulla.
  proxy_pass http://127.0.0.1:3000/;

  # Gli avatar arrivano in base64 dentro un messaggio WebSocket, ma la soglia vale
  # comunque per il resto del traffico HTTP.
  client_max_body_size 4m;

  proxy_http_version 1.1;
  proxy_set_header Upgrade    $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host       $host;
  proxy_set_header X-Real-IP  $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Fra una mano e l'altra il socket resta aperto senza traffico: col timeout predefinito
  # di 60s nginx lo chiuderebbe e il client si riconnetterebbe in continuazione.
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  # Lo stato del tavolo va consegnato subito, non accumulato in un buffer.
  proxy_buffering off;
}
