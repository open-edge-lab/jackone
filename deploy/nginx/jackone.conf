# Reverse proxy di JackOne sul server di sviluppo.
#
# Il gioco gira in un container esposto solo su 127.0.0.1:3000 e viene
# pubblicato sotto https://<host>/jackone/. La barra finale in `proxy_pass`
# toglie il prefisso: il container continua a vedere richieste sulla root e
# non sa di stare dietro a nulla.

# Il WebSocket ha bisogno che l'header Connection sia `upgrade` solo quando il
# client chiede davvero l'upgrade, `close` altrimenti.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  # In LAN il certificato è autofirmato, ma il gioco usa `navigator.clipboard`
  # e la fotocamera per gli avatar: fuori da un contesto sicuro il browser li
  # disattiva. Quindi si passa comunque da https.
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/ssl/jackone.crt;
  ssl_certificate_key /etc/nginx/ssl/jackone.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:10m;

  # Gli avatar arrivano in base64 dentro un messaggio WebSocket, ma la soglia
  # vale comunque per il resto del traffico HTTP.
  client_max_body_size 4m;

  # Senza barra finale i percorsi relativi della pagina si risolverebbero sulla
  # root del server: `/css/main.css` invece di `/jackone/css/main.css`.
  location = /jackone {
    return 301 /jackone/;
  }

  location /jackone/ {
    proxy_pass http://127.0.0.1:3000/;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Fra una mano e l'altra il socket resta aperto senza traffico: col timeout
    # predefinito di 60s nginx lo chiuderebbe e il client si riconnetterebbe
    # in continuazione.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Lo stato del tavolo va consegnato subito, non accumulato in un buffer.
    proxy_buffering off;
  }

  # La root non deve portare al gioco: il server dev ospiterà altro, e chi
  # arriva qui per sbaglio non deve ritrovarsi a un tavolo. Pagina vuota.
  location = / {
    default_type text/html;
    return 200 '<!doctype html><html lang="it"><head><meta charset="utf-8"><title></title></head><body></body></html>';
  }
}
